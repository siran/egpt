# en_US: THE single source of the built-in system_messages texts (src/tools/template.mjs holds only each kind's variables).
# A language pack lists the same keys, translated, with exactly the same {placeholders}. Docs: MANUAL.md.
system_messages:
  command_audit: "{command} in {chat} by {sender}{details}"
  going_down: "↻ {kind}… (pid {pid})"
  started: "✅ egpt started ({sha}) pid {pid}{details}"
  back_up: "✅ egpt back up! ({head}) {pids}{details}"
  pending_updates: "⬆ pending: {details}{ask}"
  egpt_update_notice: "⬆ {node} · {details}"
  egpt_update_stuck: "⬆ {node} · {details}"
  beeper_update_notice: "⬆ {node} · {details}"
  beeper_update_start: "🔄 {node} · Beeper {from} → {to} · restarting for update… {marker}"
  beeper_update_result: "🔄 {node} · Beeper {from} → {to}{details}"
  beeper_update_refused: "{node} · {details}"
  beeper_connection_gone: "{node} · ⚠ Beeper connection '{connection}' has answered on no port for {minutes} min — no install answers its token (Beeper not running, a service that can no longer log on, or a revoked token)"
  beeper_connection_back: "{node} · ✓ Beeper connection '{connection}' answers again ({url})"
  media_flood: "{node} · {details}"
  send_rate_guard: "{node} · send-rate guard paused {chat} — {why}"
  lag_probe: "{node} · {details}"
  undelivered: "{node} · ⚠ {what}{being} not delivered to {title}{chat} — {reason}"
  secret_changed: "🔐 {node} · secret {name} {action} by {who} ({kind})"
  secret_opened: "🔐 {node} · secrets page opened by {who}'s link"
  public_error: "{being} in {chat}: {text}"
  drain_waiting: "{node} · restart waiting {elapsed} for {details}. Send /restart force to proceed."
  config_refused: "{node} · config.yaml change refused, the running config stays: {error}"
  background_unanswered: "{node} · {being} in {chat}: background task(s) {what} running {elapsed}, the being did not answer whether they are still needed."
  login_captcha: "login {site}: a CAPTCHA is blocking sign-in — solve it in the brain Chrome, then re-run /login {site}. (screenshot {bytes}B captured; image delivery pending)"
  compacted: "🗜️ {who}{where} compacted its context{was}. The full history stays in its transcript.md."
  compaction_frame: "🗜️ {who}{where}: {text}"
