# es_VE: Latin-American Spanish pack for system_messages (neutral, "tú"/impersonal). Same keys and exactly the
# same {placeholders} as en_US.yaml; a key left out falls back to en_US. Docs: MANUAL.md.
system_messages:
  command_audit: "{command} en {chat} por {sender}{details}"
  going_down: "↻ {kind}… (pid {pid})"
  started: "✅ egpt iniciado ({sha}) pid {pid}{details}"
  back_up: "✅ ¡egpt de vuelta! ({head}) {pids}{details}"
  pending_updates: "⬆ pendiente: {details}{ask}"
  egpt_update_notice: "⬆ {node} · {details}"
  egpt_update_stuck: "⬆ {node} · {details}"
  beeper_update_notice: "⬆ {node} · {details}"
  beeper_update_start: "🔄 {node} · Beeper {from} → {to} · reiniciando para actualizar… {marker}"
  beeper_update_result: "🔄 {node} · Beeper {from} → {to}{details}"
  beeper_update_refused: "{node} · {details}"
  beeper_connection_gone: "{node} · ⚠ La conexión de Beeper '{connection}' no responde en ningún puerto desde hace {minutes} min — ninguna instalación responde a su token (Beeper no está en ejecución, un servicio que ya no puede iniciar sesión, o un token revocado)"
  beeper_connection_back: "{node} · ✓ La conexión de Beeper '{connection}' vuelve a responder ({url})"
  media_flood: "{node} · {details}"
  send_rate_guard: "{node} · el límite de envío pausó {chat} — {why}"
  lag_probe: "{node} · {details}"
  undelivered: "{node} · ⚠ {what}{being} no entregado a {title}{chat} — {reason}"
  public_error: "{being} en {chat}: {text}"
  drain_waiting: "{node} · el reinicio lleva {elapsed} esperando {details}. Envía /restart force para continuar."
  config_refused: "{node} · cambio de config.yaml rechazado, la configuración en ejecución se mantiene: {error}"
  background_unanswered: "{node} · {being} en {chat}: la(s) tarea(s) en segundo plano {what} llevan {elapsed} en ejecución, el ser no respondió si todavía se necesitan."
  login_captcha: "login {site}: un CAPTCHA bloquea el inicio de sesión — resuélvelo en el Chrome del cerebro y vuelve a ejecutar /login {site}. (captura de {bytes}B tomada; envío de la imagen pendiente)"
  compacted: "🗜️ {who}{where} compactó su contexto{was}. El historial completo queda en su transcript.md."
  compaction_frame: "🗜️ {who}{where}: {text}"
