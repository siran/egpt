# config.yaml - one eGPT node.
#
# Don't configure by hand. Please run configuration script: <>
#
#
# Please copy this file, and paste into you favorite agentic coder, or configure
# manually, old-school way.
#
#
# Copy this file to ~/.egpt/config/config.yaml, fill the
# blanks, and the node runs. Uncommented = working default; commented = optional
# override (default shown). Full key reference: config/config-schema.mjs.
# Comments are ASCII-only on purpose: this file is copied/seeded across machines,
# and non-ASCII punctuation corrupts through some encodings.

# --- Beeper accounts ---------------------------------------------------------
# eGPT reaches the world through Beeper Desktop's local API, on 127.0.0.1.
#
# YOU DO NOT CONFIGURE A PORT. Beeper takes the first free one from 23373, so the
# number follows start order, not identity, and it changes when installs restart
# in a different order. Your TOKEN is the address instead: a token belongs to the
# install it was minted on, which is the only one that answers it (every other
# install answers 401), so eGPT probes 23373-23382 with your token at boot and
# again on every reconnect, and logs the port it found.
#
# ONE TOKEN IS THE WHOLE REQUIREMENT. One account, one node, running in your
# ordinary logged-in desktop session - that is the baseline, it is what eGPT has
# always been, and it is meant to stay that way. Fill in `main.token` below and
# this block is finished. Everything else in this section is OPTIONAL EXPANSION
# that a node may grow into later; a node that declares none of it behaves
# exactly as it did before those features existed, and the test suite locks that
# (tests/single-account-node.test.mjs).
#
# Store one or MANY accounts (each account + its token together); `use` selects
# the one this node connects with - switch by changing `use`, no re-typing tokens.
# Keep this file private. Token: Beeper Desktop > Settings > Developer > Desktop API.
#
# THE OPTIONAL KEYS, and what each one is FOR - do not add them speculatively:
#   base_url / ws_url  A Beeper Desktop that is NOT on this machine's loopback
#                      range - another host, or a port outside 23373-23382.
#                      SETTING base_url SKIPS THE LOOKUP ENTIRELY: eGPT dials
#                      exactly what you named, forever. ws_url is derived from
#                      base_url unless you give it. Absent = the port is found.
#   owner_node         WHICH node wakes on this connection, when the SAME account
#                      is live on several nodes. Every other node still SENDS on
#                      it. Absent = every node wakes, which is right for one node.
#   endpoints          DEPRECATED - a list of (base_url, token) candidates tried
#                      in order. The token lookup above answers the same question
#                      without a port list; a list repeating one token across
#                      several ports collapses to plain account + token.
beeper:
  use: main                       # which account below this node connects with
  main:
    account: "you@example.com"    # the account this token belongs to (label)
    token: "PASTE_YOUR_TOKEN_HERE"
  # alt:
  #   account: "other@example.com"
  #   token: "PASTE_YOUR_TOKEN_HERE"

# --- This node's identity ----------------------------------------------------
node_name: kg                     # REQUIRED - this node's name on the network, and the
                                  # STRUCTURAL signature every outbound frame carries
                                  # (tag-encoded, invisible). No node_name = no boot.
# node_alias: [kg2, kg3]            # extra identities this ONE process also answers to
user_name: "John"                  # the human here; shown as <user_name>@<surface>

# peer_nodes - node identities sharing THIS Beeper account (include self).
# Nodes on DIFFERENT accounts appear as distinct room members and need no listing;
# co-account nodes collapse to one member, so list them here to complete the HRW
# candidate set. Omit for a solo node.
# peer_nodes: [kg, do]

# egpt_nodes - the eGPT nodes YOU run, and HOW TO REACH each one. OPTIONAL: a
# single node needs none of this. Read by src/tools/beeper-whoami.mjs (the
# topology table) and by nothing else: every entry that is not `type: self` is a
# peer it probes over ssh, so a node listed here needs no --host flag (--host
# still names one that is not listed; the two are unioned).
# NOTHING IS DISCOVERED - no subnet scan, no ARP, no broadcast. A peer exists
# because you named it. `host` (default: the map key) is THE way in, never `ip`:
# a node can be off-LAN and reachable only by a tailscale/DNS name.
#   type     self | peer - exactly ONE entry is self (this machine)
#   name     host name; the label in the table's host column
#   ip       the address you know it by. On the self entry it overrides
#            auto-detection; absent is fine for an off-LAN node.
#   ip_type  reserved | fixed | dhcp - how that address is held (documentation only)
#   host     ssh target: hostname / ip / ssh alias / VPN name. Default: the map key.
# egpt_nodes:
#   kg:
#     type: self
#     name: KG
#     ip: 192.0.2.11
#     ip_type: reserved
#   do:
#     type: peer
#     name: DO
#     ip: 192.0.2.12
#     ip_type: reserved
#     host: do.example.net

# --- peer_spine: speaking through the OTHER spine (the "mouth link") ---------
# OPTIONAL, and only for a machine running TWO spines - one per Beeper account,
# one checkout, differing only by EGPT_HOME. The PRIMARY spine is the ear and the
# brain: it receives, logs, gates and runs the turn exactly as it always has. The
# SECONDARY is the MOUTH: the primary hands it the finished text over this link
# and it says that text on the other account. A message addressed to the
# secondary alone is answered by the secondary directly, with no link involved.
#
# ABSENT = NO PEER: no dialling, no link, and a /peer dial to this node's console
# is refused. A single-account node needs none of this and pays nothing for it.
#
#   console_port   the PEER node's shell.port (its console listener; default
#                  23375). The link rides that port - the token handshake and the
#                  bind-at-boot-and-hold property are already solved there - on
#                  the path /peer, which is what marks the dial as a peer spine
#                  rather than the operator's editor asking for the console seat.
#   console_token  the PEER node's shell.token. Same nonce/HMAC challenge the
#                  editor answers; wrong or unset = refused. Loopback is not an
#                  authenticator here.
#   accounts       the phone numbers of BOTH accounts. Beeper is Matrix, so each
#                  account sees the same real group as its OWN room and a chat id
#                  cannot cross the link; what crosses is the set of participant
#                  phone numbers. Each account sees the OTHER as an ordinary
#                  member with a number (and itself as a number-less self entry),
#                  so both are excluded here to make the two views line up. The
#                  SAME list goes on both nodes, and fewer than two is refused.
# peer_spine:
#   console_port: 23377
#   console_token: "PASTE_THE_PEER_NODES_SHELL_TOKEN_HERE"
#   accounts: ["+15550000001", "+15550000002"]

# --- Agents (what this node answers to) --------------------------------------
# REQUIRED. A node answers ONLY the agents it lists - nothing is injected. Two
# nodes hosting the same name BOTH reply (same being); use different names for a
# single answerer. The bridge stamps body_emoji so humans see which node spoke.
agents:
  egpt:
    configuration:                # the brain, written INLINE. An inline map is the WHOLE def and is
      type: ccode                 # merged with nothing, which is how each agent below carries its own
      model: haiku                # personality while sharing one engine.
      effort: low
      verbose_thinking: true
      personality: egpt           # identity feed: config/agents/identities/egpt.md
    #                             # THE OTHER FORM: `configuration: haiku-low` - the bare NAME of a
    #                             # config/agents/<name>.yaml. The shipped grid is <model>-<effort>.yaml
    #                             # for haiku|sonnet|opus x low|medium|high|xhigh|max. Those files carry
    #                             # no personality:, so an agent that needs its own writes the map inline.
    handles: [e, egpt, ekg]       # THE wake list: @e / @egpt / @ekg reach this node's persona.
    #                             # Declared handles are COMPLETE — the map key does NOT wake.
    #                             # Omit handles and the key wakes instead; [] means nothing does.
    #                             # The full form is <letter><node_name>, so rename these with the node.
    #                             # A SECOND profile on this machine (its own EGPT_HOME) suffixes s:
    #                             # ekgs / kkgs / wkgs, so a mention picks one profile, not both.
    default: true                 # THE persona: answers un-mentioned messages + ends relay chains. EXACTLY ONE agent per node. Its map KEY is the being-id (renaming the key = a new identity).
    name: "egpt"                  # REQUIRED for any agent that runs turns: the display label the
    #                             # bridge stamps ("<emoji> <name>: <reply>"). It does NOT default to
    #                             # the map key - that fallback was removed 2026-09-01 because the key
    #                             # is an IDENTIFIER, not a display name, and conflating the two is how
    #                             # a relayed reply once got stamped with the wrong being's name. An
    #                             # agent with no name: stamps BLANK, and boot says so at every startup.
    # body_emoji: "<emoji>"       # reply stamp the bridge enforces; default is the dog.
    #                             # A 2nd node sets its OWN so humans see which node spoke.
    # conversation_defaults:      # THIS AGENT'S global defaults for fields conversations.yaml can
    #                             # override per-conversation - the nesting IS the allowlist (only
    #                             # fields living here get a per-conversation override at all).
    #   allowed_users: []         # reachability default (id list, same shape as networks.*.allowed_users
    #                             # below) - unset = reachable by anyone who could normally address it.
    #                             # Overridable per-conversation (conversations.yaml
    #                             # agents.<name>.allowed_users) - the override REPLACES this list
    #                             # there, it does not merge with it.
    #   access_level: regular     # access_level default (all|regular) - points at
    #                             # config/permissions/<level>.md. Overridable per-conversation
    #                             # (conversations.yaml agents.<name>.access_level, same replace-not-merge rule).
    #   sandboxed: true           # OS-level process isolation for this agent's CLI, underneath
    #                             # access_level. WINDOWS-ONLY machinery, so the default when UNSET
    #                             # is platform-aware: true on Windows, false elsewhere. Setting it
    #                             # true off Windows is an explicit request and FAILS LOUDLY rather
    #                             # than running unsandboxed. Overridable per-conversation
    #                             # (conversations.yaml agents.<name>.sandboxed).
    #   verbose_thinking: false   # render this agent's chain of thought above its answers (operator
    #                             # 2026-08-30: "verbose thinking should be controlled from config.yaml
    #                             # rather than the agent.yaml"). Overridable per-conversation
    #                             # (conversations.yaml agents.<name>.verbose_thinking). The one field
    #                             # here with a THIRD tier below it: the agent-TYPE file's own
    #                             # verbose_thinking, used only when both tiers above are unset.
    #   allow_new_input: same_sender
    #                             # none|same_sender|any (default same_sender) - what happens to a
    #                             # message that arrives while this agent is ALREADY streaming a turn
    #                             # here (operator 2026-08-30). none = queue it behind, prompt it into
    #                             # the next turn (the old behavior). same_sender = a message from the
    #                             # SAME person the live turn is answering STEERS that turn - one
    #                             # reply, no second placeholder; anyone else queues. any = any sender
    #                             # steers it. ONLY TESTED WITH ccode: it rides the claude CLI's
    #                             # stream-json stdin, which absorbs a mid-turn line at a tool
    #                             # boundary. pi is untested and llama has no stream, so with either
    #                             # every value behaves like none. Overridable per-conversation
    #                             # (conversations.yaml agents.<name>.allow_new_input).

  # The other two shipped characters. Same shape as egpt above, minus the documentation:
  # a brain, a personality file, an explicit wake list, a display name. Neither is default.
  ken:
    configuration:
      type: ccode
      model: opus
      effort: high
      personality: ken            # config/agents/identities/ken.md
    handles: [k, ken, kkg]
    name: "ken"
  wren:
    configuration:
      type: ccode
      model: opus
      effort: xhigh
      personality: wren           # config/agents/identities/wren.md
    handles: [w, wren, wkg]
    name: "wren"
    conversation_defaults:
      access_level: all         # the ONE unsandboxed being - it runs as you, because its job is to change the machine
      sandboxed: false

# Relay agents (optional - foreign-mesh across SEPARATE accounts). A relay
# forwards a mention into another chat; `to:` chains hops. Not needed within one account.
# carol: { relay_channel: rodz1, to: don.do }

# --- Surfaces (who may command this node) ------------------------------------
# Per-surface, because ids are per-network namespaces. allowed_users = STABLE ids
# (jids / room ids, never display names); [] = deny (the account owner is always
# allowed). chat_id = your Self-DM command channel, auto-captured on first contact.
networks:
  whatsapp:
    chat_ids: [] # chats that accept commands (/egpt, /restart, /upgrade, etc)
    allowed_users: [] # id of user allowed to issue commands in the chat_ids
  telegram: { chat_ids: [], allowed_users: [] }
  signal:   { chat_ids: [], allowed_users: [] }

# --- Dispatch: global E-routing knobs ----------------------------------------
# E is a sibling, not a network, so these live OUTSIDE the transport blocks.
# Per-chat modes live in each conversation (set via /e auto <mode> <chat>); these
# are the node-wide defaults. All commented = defaults shown.
# dispatch:
#   auto_default_mode: mention      # reply mode for a chat with no explicit mode (on|auto|mute|mention-direct|mention|accum|off).
#                                   # accum gates exactly like mention AND prompts each turn with what was said since the
#                                   # persona's LAST turn, labelled as context. PERSONA only — siblings default to mention.
#   auto_paused: false              # absolute @e-emit kill-switch (/e auto pause|resume)
#   send_to_egpt: mode              # global default: keep the persona in context even when it will not reply (always|mode)
#   address_without_at: true        # a BARE handle opening a message addresses its agent ("d hola" = "@d hola").
#                                   # false = the '@' is required. Node-wide; the '@' form and the quick reply ("r ok") are unaffected.

# --- Transcription: a standalone LAN service ---------------------------------
# By default eGPT launches a whisper-server to transcribe audio notes
# (ask your AI to download models from: https://huggingface.co/ggerganov/whisper.cpp)
#
# transcription_service:
#   enabled: true
#   use_config: main
#   main:
#     fallback_order: [gpu, local]
#     gpu:   { type: whisper-server-remote, endpoint: "http://192.168.1.102:23390", token: "SHARED_SECRET" }
#     local: { type: whisper-cli, command: C:\path\whisper-cli.exe, model_path: C:\path\ggml-large-v3.bin, language: es, ffmpeg_command: C:\path\ffmpeg.exe }
#
# To HOST the server for other nodes (the GPU box - the "transcriptor" worker role):
# transcriptor:
#   enabled: true                 # answer POST /v1/transcribe for a main spine (this node's WORKER role)
#   bind: "0.0.0.0"               # LAN ip / 0.0.0.0 to accept a remote spine; NEVER the internet
#   port: 23390                   # what a client's transcription_service endpoint points at
#   server:                       # resident whisper.cpp server: load the model ONCE (~12s per note -> ~2s)
#     enabled: true
#     command: C:\path\whisper-server.exe
#     model: C:\path\ggml-large-v3.bin   # falls back to transcription.cli.model_path below
#     host: 127.0.0.1
#     port: 8089
#     language: es
# transcription:
#   server: { token: "SHARED_SECRET" }   # HMAC auth; SAME value on the worker and its clients
#   cli:                          # whisper-cli binary/model: the worker's engine + the universal fallback
#     command: C:\path\whisper-cli.exe
#     model_path: C:\path\ggml-large-v3.bin
#     language: es
#     ffmpeg_command: C:\path\ffmpeg.exe

# --- Voice: a standalone LAN TTS service --------------------------------------
# The text-to-speech counterpart to transcription_service above: piper renders text,
# ffmpeg transcodes to Opus/ogg. Not launched by default — set voice_service on a main
# spine to use a remote piper worker.
#
# voice_service:
#   use_config: main
#   main:
#     fallback_order: [gpu]
#     gpu: { type: piper-server-remote, endpoint: "http://192.168.1.102:23391", token: "SHARED_SECRET" }
#
# To HOST the server for other nodes (the GPU box - the "synthesizer" worker role):
# synthesizer:
#   enabled: true                 # answer POST /v1/synthesize for a main spine (this node's WORKER role)
#   bind: "0.0.0.0"               # LAN ip / 0.0.0.0 to accept a remote spine; NEVER the internet
#   port: 23391                   # what a client's voice_service endpoint points at
#   server: { token: "SHARED_SECRET" }   # HMAC auth; SAME value on the worker and its clients
#   ffmpeg_command: C:\path\ffmpeg.exe
# Piper itself is NOT config: set the RADIO_PIPER env var to the piper install root on
# this machine (must contain venv\Scripts\python.exe and voices\*.onnx).

# --- Transcript echo: who posts the ear ("listened") transcript --------------
# The echo posts a voice note's transcript back into the chat. Among the echo-capable
# eGPT nodes present in a room, HRW picks exactly ONE to post each note (rotates per
# note - no fixed echoer, no duplicate). If the picked node stays silent past
# echo_timeout_ms, the next-ranked node takes over (covers an offline node).
# echo: true                      # this node may echo (default true)
# echo_timeout_ms: 5000           # rank N+1 promotes after this much silence
# echo_max_age_ms: 3600000        # never echo a note older than this (skips resynced backlog)

# --- Everyday knobs (defaults shown) -----------------------------------------
# default_time_zone: "America/New_York"                       # timezone-less heartbeat times
# warm: { max: 6, idle_ttl_by_class: { conversation: 15m } }  # -1 = never evict, 0 = always
# compaction: { enabled: true, ratio: 0.20, cooling_ms: 120000 }
# guard: { turns: 6, window: -1 }   # loop-breaker: N consecutive non-human turns pause a channel (a human msg resets); -1 turns = off, -1 window = pure consecutive count
# lasso: { messages: 18, window_ms: 10000, edits: 4000 }   # outbound ceiling: an over-ceiling emit STOPS the node (config/config-schema.mjs: lasso)
# advice_channel: "EGPT AUTO"     # mode:auto consult chat (fail-closed if unset)
# aliases: { "@whatsapp_5215512345678:beeper.local": An }     # /status display labels
