# conversations.yaml - the REGISTRY: one entry per conversation, whole node.
# Lives at ~/.egpt/config/conversations.yaml. The spine creates it on first
# contact, so this file is a REFERENCE to read beside the real one.
# Why each option exists: config/config-schema.mjs.
#
# NOT to be confused with the per-conversation FOLDER config
# ~/.egpt/conversations/<surface>/<slug>/config.yaml - members, warm,
# transcription, heartbeats. See config/skeletons/room/config.yaml.
# Here: which agent replies and how. There: the conversation as a room.
#
# COMMENTS YOU ADD HERE DO NOT SURVIVE. The spine rewrites this file on every
# state change and rebuilds it from memory (serialize(), src/conversations-
# state.mjs), erasing them. Only the `# <name>` on the id line persists - the
# spine re-derives that one. So set real keys here; read this file for what
# they mean. Locked by tests/conversations-state.test.mjs.
# Edits are hot (re-read per lookup, no restart), but prefer `/e auto <mode>`
# and the `/e` wizard where they cover it - a hand edit can race a spine write.

contacts:

  # surface: whatsapp | telegram | shell | signal (KNOWN_SURFACES) - others throw
  whatsapp:

    # the chat id as the bridge reports it; quote it. `# <name>` is the chat
    # title, spine-written. shell has ONE seat, id `main`, fixed slug `lobby`.
    "EXAMPLE_CHAT_ID": # Some Group

      # where the folder is, home-relative; the slug is its basename (not stored)
      conversation_path: .egpt/conversations/whatsapp/some-group-2606291919
      # the home conversation_path is relative to, msys-style. Pointer only.
      home_dir: /c/Users/an

      # 👂 voice-note echo delay ms: -1 never echo, 0 immediate, N debounce
      # default: config.yaml transcription_service.posts_back_delay_ms
      #posts_back_delay_ms: -1

      # loop-breaker override; node default config.yaml guard: {turns: 6, window: -1}
      # turns = consecutive non-human turns before pausing (-1/0 off), window = minutes
      #guard: { turns: -1 }

      # one block per resident agent, keyed by its config.yaml agents: name
      egpt:

        # how this agent wakes here: on | auto | mute | mention-direct | mention | off
        # default: config.yaml agents.<name>.mode, then dispatch.auto_default_mode
        #mode: mention

        # persona only - keep it in context on messages it won't answer: always | mode
        #send_to_egpt: mode

        # spine-written, don't hand-edit. Deleting threadId starts a new session
        # AND re-reads this agent's config (the block above + the pins below).
        threadId: null
        #threadCreatedAt: 2026-07-10T16:39:39.948Z
        #identityInjectedAt: 2026-07-10T16:39:39.948Z

        # spine-written freeze of the agent type this thread was instanced from.
        # Change it with /e new | /e identity | /e brain, not by hand.
        #readonly:
        #  agent: egpt                 # the config.yaml agents: entry
        #  type: ccode                 # the engine
        #  model: sonnet               # sonnet | opus | haiku
        #  effort: high                # high | medium | low
        #  allowed_tools: [Read, Write, Edit, Glob, Grep, WebSearch, WebFetch, Task]
        #                              # a LIST confines file tools to the folder;
        #                              # "all" is rejected and coerced back to this

      # per-conversation overrides, layered field-wise OVER the blocks above:
      # mode, send_to_egpt, and the readonly five FLAT - each pins only itself.
      #agents:
      #  egpt: { mode: auto, model: opus }
      #  don:  { mode: mention-direct }

    # a second id for the SAME contact - one thread, one folder, one mode.
    # One level only; an alias pointing at an alias resolves to nothing.
    #"584122182178@s.whatsapp.net":
    #  aliasOf: "EXAMPLE_CHAT_ID"

  #telegram:
  #  "88164392": # An
  #    conversation_path: .egpt/conversations/telegram/an-2605211200
  #    home_dir: /c/Users/an

  #shell:
  #  main: # console
  #    conversation_path: .egpt/conversations/shell/lobby
  #    home_dir: /c/Users/an


# INERT - `system_thread:` at the root: round-trips, nothing reads it. Don't copy
# forward. (The legacy FLAT entry keys that used to be listed here - threadId, mode,
# send_to_egpt, readonly, personality, transcribe, threadCwd, firstSeenAt and the two
# thread timestamps - were deleted from the code on 2026-07-26. An entry on disk may
# still carry them; they are inert data, and nothing here documents them any more.)
