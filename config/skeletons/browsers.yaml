# config/browsers.yaml — WHICH CHROME EACH CHAT USES. Operator-only: copy to ~/.egpt/config/.
#
# Groups of chats, by chat NAME (the same on every node). One Chrome profile per group, and a
# being drives only its own group's Chrome, so what is signed in to one group is invisible to the
# others. Group name = profile dir name:
#   brain        → chrome.profile_dir (config.yaml), the profile holding Gmail / ClassDojo / AWS
#   any other    → ~/.egpt/chrome/profiles/<group>
# Any chat not listed → `shared` (its own, initially empty profile).
# A chat listed in two groups, or a group name that is not a plain dir name, gets NO browser.
# Read fresh on every lookup: an edit needs no restart.
#
# Each group's Chrome is named after the group: the profile name, and the title of the window Chrome
# opens at startup (--window-name; a window restored from the last session keeps its saved title).
# The profile also gets a theme color. Name and color are written into the profile just before its
# Chrome starts, so a change shows at the next launch of that group's Chrome. The color is picked
# from a fixed palette by the group name; `colors:` overrides it per group ("#RRGGBB").
#
# Uploads: in every group (shared too) a boxed being may attach files to web forms, but only plain
# files inside its own conversation's folder; Chrome gets a checked copy. `uploads:` turns a group
# off with `false` (any value but true is off; a file that will not parse turns every group off).
# A conversation's privileged_browser (conversations.yaml) still wins. Read per upload.

groups:
  brain: [ "eGPT Admin", "eGPT Rodz Lola An" ]
  # work: [ "Some Chat" ]

