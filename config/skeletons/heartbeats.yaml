# heartbeats.yaml — paste this `heartbeats:` block into a chat folder's
# config.yaml (~/.egpt/conversations/<surface>/<slug>/config.yaml, or a room's
# ~/.egpt/rooms/<name>/config.yaml). The spine collects it at boot and lists the
# resolved set in ~/.egpt/heartbeats.readonly.yaml.
#
# Each entry has ONE trigger and ONE action:
#   trigger — `when:` (a one-shot wall-clock time) OR `frequency:` (recurring)
#             OR `daily:` (every day at a wall-clock time)
#   action  — `script_path:` (a *.x.md textecutable) OR `command:` (a shell line)
#
# `script_path:` is relative to THE FOLDER THIS BLOCK LIVES IN (the chat/room
# folder; the checkout for a node-level beat) — not to a scripts/ subfolder. A
# bare `script.x.md` sits beside config.yaml; a script in a subfolder must say
# so (`scripts/script.x.md`). A wrong path is ENOENT on every tick.
#
# WHO RUNS A script_path: by default nobody — it opens its own CLI session with
# no persona, no transcript and no access_level/allowed_users/sandboxed limits.
# Add `agent: <handle>` beside a `script_path:` and the script runs as a TURN for
# that being instead, in this chat/room, through every gate an ordinary message
# turn passes. See the commented `dj` entry below.
#
# `agent:` takes the HANDLE — what you'd @address it as, e.g. `agent: pd`, not
# the config.yaml `agents:` map key. An agent that declares `handles:` answers to
# THOSE ONLY (its key is not an address); an agent that declares none answers to
# its key. Same rule as an @mention, so both always mean the same being.
# Constraints: `agent:` needs a `script_path:` (never `command:` — a shell line
# has no being), and the beat must be declared in a CHAT/ROOM config.yaml — a
# node-level beat names no entity for the turn to run in. Break any of those and
# the entry is skipped and logged, never silently run unconfined.
#
# `when:` times are wall-clock in the zone from config `default_time_zone`
# (e.g. America/New_York, or an alias like "New York" / "ET"); with no config
# zone set, the machine's local zone is used. Accepted forms:
#   7/2/2026 8:20a   (12-hour am/pm)   7/2/2026 08:20   (24-hour)
#   2026-07-02T08:20 (ISO, optional :seconds)
#
# `daily: "HH:MM"` (24-hour) fires EVERY day at that time in `time_zone:` (an
# IANA name like Atlantic/Canary, or an alias like "ET"; absent → config
# `default_time_zone`; an invalid zone skips the entry). `frequency: 24h` is NOT
# the same thing: a cadence starts counting when the beat is registered, so it
# fires at every boot and every config reload. daily: fires at most once per
# day in that zone, within 2 minutes after the time — a node that was down
# through that window skips the day rather than firing late. DST follows the
# zone. The last day each beat fired is kept in
# ~/.egpt/state/heartbeats-daily.json, so a restart inside the window never
# fires it twice.
#
# `command:` runs under POSIX bash on Windows (msys64's bash.exe, never
# System32's WSL bash; the resolved path is `shell:` in heartbeats.readonly
# .yaml) and under /bin/sh elsewhere. Inside that bash, call bash again as
# "$BASH", not `bash` — PATH can still reach the WSL launcher first. The
# default alive command stays on the native shell (liveness never depends on msys).
#
# `post: "<template>"` beside a `command:` posts the command's output into THIS
# chat: on exit 0 with non-empty output, `{stdout}` (trimmed) is replaced into
# the template and sent. A failed or silent command posts nothing (the log says
# why). Needs a `command:`, and a chat/room config.yaml — never a node-level beat.
#
# HOT RELOAD: delete ANY of ~/.egpt/{config,conversations,heartbeats}.readonly
# .yaml and the spine re-scans every config rung within ~30s — no restart. New
# chat folders are picked up too.

heartbeats:
  # one-shot: run a textecutable once, at/after the given time, then never again
  morning-report:
    when: 7/2/2026 8:20a
    script_path: script.x.md

  # recurring: run a shell command on a fixed cadence (ms/s/m/h)
  daily-sweep:
    frequency: 24h
    command: echo swept > last-sweep.txt

  # daily: every day at 14:00 Tenerife time. In a chat's config.yaml, add
  #   post: "El primo del día es {stdout}"
  # to post the output into that chat.
  primo-del-dia:
    daily: "14:00"
    time_zone: Atlantic/Canary
    command: '"$BASH" scripts/nth_prime.sh "$(TZ=Atlantic/Canary date +%-j)"'

  # recurring, run BY A BEING: the script is a turn for whoever answers to `pd`
  # (its handle, not its map key). Left commented because it only loads from a
  # chat/room config.yaml — uncomment it there, not in the node config.
  # dj:
  #   frequency: 30m
  #   agent: pd
  #   script_path: dj.x.md

  # …or a ONE-LINE instruction instead of a script (`prompt:`). A turn beat's reply
  # is posted into the chat as that being; an empty or "…" reply posts nothing.
  # el-porque:
  #   daily: "14:05"
  #   time_zone: Atlantic/Canary
  #   agent: pd
  #   prompt: "Explica en una frase por qué el número de hoy es primo."
