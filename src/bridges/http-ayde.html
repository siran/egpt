<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ayde</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1d2330; --muted: #667085; --line: #e3e6ec; --accent: #1f6feb; --warn: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --card: #1c2027; --ink: #e6e8ec; --muted: #98a2b3; --line: #2c323c; --accent: #58a6ff; --warn: #f97066; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header span { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(300px, 1.4fr); gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  h2 { font-size: 14px; margin: 0 0 8px; overflow-wrap: anywhere; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  input { flex: 1 1 120px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); text-align: left; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  tr.pick { cursor: pointer; }
  tr.pick:hover, tr.on { background: var(--bg); }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .bar { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .row .size { margin-left: auto; color: var(--muted); white-space: nowrap; }
  .above { opacity: .45; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 60vh; overflow: auto; margin: 8px 0 0; }
</style>
</head>
<body>
<header><h1>ayde</h1><span id="who"></span><span>Read-only · every folder and file opened is logged</span></header>
<p id="fail" class="warn" hidden></p>
<main>
  <section>
    <h2>Website conversations</h2>
    <form id="find"><input id="q" placeholder="Username" autocomplete="off"><input id="abrin" placeholder="School (abrin)" autocomplete="off"><button>Search</button></form>
    <table><thead><tr><th>Username</th><th>Name</th><th>Type</th><th>School</th><th>Last activity</th></tr></thead><tbody id="found"></tbody></table>
    <p id="none" class="muted" hidden>No results.</p>
  </section>
  <section>
    <div class="bar"><button id="up">Up</button><h2 id="where"></h2></div>
    <div id="tree"></div>
    <div id="view"></div>
  </section>
</main>
<script>
(() => {
  const LEVELS = ['team', 'devs', 'admin', 'root'];
  const $ = (id) => document.getElementById(id);
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
  const when = (ms) => new Date(ms).toLocaleString();
  const size = (n) => (n == null ? '' : n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`);
  const fail = (text) => { $('fail').textContent = text; $('fail').hidden = false; };
  const join = (dir, name) => (dir ? `${dir}/${name}` : name);
  let top = null;
  let homes = new Set();   // below root: the scope's folders, whose "Up" is the scope again
  // A path above the user's level answers 401 in that level's realm: the browser asks for that login.
  // 403: a login above public_max_level, from the internet.
  async function call(sub, params) {
    const r = await fetch(`${sub}?${new URLSearchParams(params)}`, { cache: 'no-store' });
    if (r.status === 401 || r.status === 403 || r.status === 429) { const b = await r.json().catch(() => ({})); fail(b.message || 'Not allowed.'); throw new Error(String(r.status)); }
    if (!r.ok) { fail(r.status === 404 ? 'Not found.' : `Error ${r.status}.`); throw new Error(String(r.status)); }
    $('fail').hidden = true;
    return r.headers.get('content-type')?.includes('json') ? r.json() : r.blob();
  }
  const me = (b) => { $('who').textContent = `· ${b.user} (${b.level})`; };
  async function find() {
    const b = await call('search', { q: $('q').value, abrin: $('abrin').value });
    me(b);
    const rows = $('found');
    rows.replaceChildren();
    for (const c of b.conversations) {
      const u = c.usuario || {};
      const tr = el('tr', null, 'pick');
      for (const v of [u.username || '(no user)', u.short_name, u.user_type, u.abrin, when(c.last)]) tr.append(el('td', v || ''));
      tr.title = c.path;
      tr.onclick = () => { for (const o of rows.children) o.classList.remove('on'); tr.classList.add('on'); open(c.path).catch(() => {}); };
      rows.append(tr);
    }
    $('none').hidden = b.conversations.length > 0;
  }
  async function open(path) {
    const b = await call('tree', path == null ? {} : { p: path });
    top = b.path;
    if (b.scope) homes = new Set(b.entries.map((e) => e.path));
    $('where').textContent = b.scope ? 'Your conversations' : b.path || 'EGPT_HOME';
    $('up').disabled = !b.path;
    $('view').replaceChildren();
    render(b, $('tree'), 0);
  }
  function render(b, box, depth) {
    me(b);
    box.replaceChildren();
    if (!b.entries.length) box.append(el('p', 'Empty folder.', 'muted'));
    for (const e of b.entries) {
      const path = e.path ?? join(b.path, e.name);
      const row = el('div', null, LEVELS.indexOf(e.level) > LEVELS.indexOf(b.level) ? 'row above' : 'row');
      row.style.paddingLeft = `${depth * 16}px`;
      if (row.classList.contains('above')) row.title = `Needs the ${e.level} level`;
      box.append(row);
      if (e.dir) {
        const kids = el('div');
        const t = el('button', `${e.name}/`, 'link');
        t.onclick = () => (kids.childElementCount ? kids.replaceChildren() : call('tree', { p: path }).then((c) => render(c, kids, depth + 1)).catch(() => {}));
        row.append(t);
        box.append(kids);
      } else {
        const v = el('button', e.name, 'link');
        v.onclick = () => show(path).catch(() => {});
        const d = el('button', 'download', 'link');
        d.onclick = () => download(path).catch(() => {});
        row.append(v, d);
      }
      if (e.link) row.append(el('span', '(link)', 'muted'));
      if (e.chats) row.append(el('span', e.chats.join(' · '), 'muted'));
      row.append(el('span', `${size(e.size)} ${when(e.mtime)}`, 'size'));
    }
    if (b.truncated) box.append(el('p', 'List cut: too many entries.', 'muted'));
  }
  async function show(path) {
    const b = await call('file', { p: path });
    const box = $('view');
    box.replaceChildren(el('h2', `${b.path} · ${size(b.size)}`));
    if (b.binary) box.append(el('p', 'Binary file: use “download”.', 'muted'));
    else {
      box.append(el('pre', b.text));
      if (b.truncated) box.append(el('p', `Showing the first ${size(b.text.length)}; download it to see all of it.`, 'muted'));
    }
  }
  async function download(path) {
    const blob = await call('file', { p: path, download: '1' });
    const a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = path.split('/').pop();
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }
  $('up').onclick = () => { const up = top.split('/').slice(0, -1).join('/'); open(homes.has(top) || !up ? undefined : up).catch(() => {}); };
  $('find').onsubmit = (ev) => { ev.preventDefault(); find().catch(() => {}); };
  open().catch(() => {});
  find().catch(() => {});
})();
</script>
</body>
</html>
